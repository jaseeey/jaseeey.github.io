          </a>
          <a class="system-link" href="#" data-contact-link="stack" aria-label="Resolving Stack Overflow">
            <span class="system-link_index">[05]</span>
            <span class="system-link_label">stack</span>
            <span class="system-link_value" data-contact-value>resolving...</span>
